$background = rgb(000000)
$foreground = rgb(ffffff)
$muted = rgb(a0a0a0)

general {
  hide_cursor = true
}

background {
  monitor =
  color = $background
}

label {
  monitor =
  text = $TIME
  color = $foreground
  font_size = 36
  font_family = Inter
  position = 48, 130
  halign = left
  valign = bottom
}

input-field {
  monitor =
  size = 280, 40
  outline_thickness = 1
  dots_size = 0.2
  dots_spacing = 0.3
  outer_color = $foreground
  inner_color = $background
  font_color = $foreground
  fail_color = $foreground
  check_color = $foreground
  placeholder_text = Contraseña
  fail_text = Inténtalo de nuevo
  rounding = 0
  position = 48, 64
  halign = left
  valign = bottom
}
